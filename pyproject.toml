[project]
name = "hermes-local-events"
version = "0.1.0"
description = "Effort-first local event finder for Hermes Agent: multi-source aggregation, kid/dog filters, party modes, energy dial, preference learning"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "moliver28" }]
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "selectolax>=0.3.21,<1",
    "feedparser>=6.0,<8",
    "icalendar>=6.0,<8",
    "rapidfuzz>=3.9,<4",
    "dateparser>=1.2,<2",
    "geopy>=2.4,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
